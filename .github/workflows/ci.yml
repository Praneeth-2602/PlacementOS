name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: |
          pip install ruff
          ruff check app || true

      - name: Run migrations
        run: alembic upgrade head
        env:
          DATABASE_URL: sqlite:///./test.db

      - name: Seed reference data
        run: python -m scripts.seed
        env:
          DATABASE_URL: sqlite:///./test.db

      - name: Run tests
        run: pytest -q
        env:
          DATABASE_URL: sqlite:///./test.db

  backend-postgres:
    # Catch SQLite -> Neon (Postgres) dialect issues before promotion.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: placementos
          POSTGRES_PASSWORD: placementos
          POSTGRES_DB: placementos
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "psycopg[binary]"
      - name: Run migrations + seed against Postgres
        run: |
          alembic upgrade head
          python -m scripts.seed
        env:
          DATABASE_URL: postgresql+psycopg://placementos:placementos@localhost:5432/placementos

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
